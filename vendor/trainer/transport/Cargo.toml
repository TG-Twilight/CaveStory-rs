[package]
name = "trainer-transport"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
trainer-protocol = { path = "../protocol", version = "=0.1.0" }
trainer-bridge = { path = "../bridge", version = "=0.1.0" }
serde = { version = "=1.0.228", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemInformation"] }
